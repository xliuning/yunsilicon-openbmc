BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend"
BBFILE_COLLECTIONS += "yunsilicon-common"
BBFILE_PATTERN_yunsilicon-common = "^${LAYERDIR}/"
BBFILE_PRIORITY_yunsilicon-common = "6"
LAYERDEPENDS_yunsilicon-common = "core"
LAYERSERIES_COMPAT_yunsilicon-common = "blacksail wrynose"
