#@TYPE: Machine
#@NAME: andes2
#@DESCRIPTION: Yunsilicon Andes2 BMC (AST2600)

# ---- Phase 1: reuse evb-ast2600 kernel dts / u-boot for now, ----
# ---- switch to board-specific DTS once it is ready ----
KERNEL_DEVICETREE = "aspeed/aspeed-bmc-yunsilicon-andes2.dtb"
UBOOT_MACHINE = "ast2600_openbmc_spl_defconfig"
UBOOT_DEVICETREE = "ast2600-evb"
SPL_BINARY = "spl/u-boot-spl.bin"

# Secure boot disabled for now
SOCSEC_SIGN_ENABLE = "0"

require conf/machine/include/ast2600.inc
require conf/machine/include/obmc-bsp-common.inc

# TODO: uncomment once meta-common provides
# conf/machine/include/yunsilicon.inc, which will hold shared
# configuration common to all Andes-series boards
#require conf/machine/include/yunsilicon.inc

SERIAL_CONSOLES = "115200;ttyS4"

PACKAGECONFIG:append:pn-phosphor-user-manager = " root-user-mgmt"
# TODO: update to match the actual SPI flash size on this board
FLASH_SIZE = "65536"

# ---- Core BMC feature switches: state mgmt, host IPMI, chassis mgmt, flash mgmt ----
MACHINE_FEATURES += "\
        obmc-bmc-state-mgmt \
        obmc-chassis-state-mgmt \
        obmc-host-ipmi \
        obmc-host-state-mgmt \
        "

# ---- Inventory / FRU data source: entity-manager ----
VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
PREFERRED_PROVIDER_virtual/obmc-inventory-data = "entity-manager"

# ---- Host-BMC IPMI hardware channel: defaults to KCS, change if the actual interface differs ----
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw ?= "phosphor-ipmi-kcs"

# TODO: host power/chassis state management provider.
# x86-power-control only applies to x86 hosts. If the andes2 host is not
# x86-based, replace this with your own power-sequencing provider.
# Left unset for now to fall back on system defaults.
#VIRTUAL-RUNTIME_obmc-host-state-manager ?= "x86-power-control"
#VIRTUAL-RUNTIME_obmc-chassis-state-manager ?= "x86-power-control"

# ---- u-boot provider, to avoid multiple-provider conflicts ----
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-aspeed-sdk"
PREFERRED_PROVIDER_u-boot = "u-boot-aspeed-sdk"
PREFERRED_PROVIDER_u-boot-fw-utils = "u-boot-fw-utils-aspeed-sdk"

# TODO: the three lines below depend on packagegroup-yunsilicon-apps, a
# company-level application packagegroup recipe. Keep them commented out
# until that recipe has been migrated into meta-yunsilicon/meta-common
# (e.g. from harma or another existing project); otherwise bitbake will
# fail with "nothing provides" errors. Uncomment once available.
PREFERRED_PROVIDER_virtual/obmc-chassis-mgmt = "packagegroup-yunsilicon-apps"
PREFERRED_PROVIDER_virtual/obmc-flash-mgmt = "packagegroup-yunsilicon-apps"
PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-yunsilicon-apps"

# MCTP support (required as the transport layer for PLDM)
include conf/distro/include/mctp.inc

# phosphor-dbus-interfaces YAML interface organization subdirs
OBMC_ORG_YAML_SUBDIRS = "xyz/openbmc_project"
