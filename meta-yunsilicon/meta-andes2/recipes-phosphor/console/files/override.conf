[Service]

ExecStartPre=
ExecStartPre=/bin/sh -c 'echo -n "io1" > /sys/bus/platform/drivers/aspeed-uart-routing/1e789098.uart-routing/uart3'
ExecStartPre=/bin/sh -c 'echo -n "uart3" > /sys/bus/platform/drivers/aspeed-uart-routing/1e789098.uart-routing/io1'
ExecStartPre=/bin/sh -c '/usr/sbin/i2ctransfer -y 7 w2@0xd 0x18 1'


ExecStopPost=
ExecStopPost=/bin/sh -c 'echo -n "io3" > /sys/bus/platform/drivers/aspeed-uart-routing/1e789098.uart-routing/uart3'
ExecStopPost=/bin/sh -c 'echo -n "uart1" > /sys/bus/platform/drivers/aspeed-uart-routing/1e789098.uart-routing/io1'
ExecStopPost=/bin/sh -c '/usr/sbin/i2ctransfer -y 7 w2@0xd 0x18 0'
