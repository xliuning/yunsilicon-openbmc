# CPU core sensors used to calculate CPU0_TEMP.
#
# These names must match the D-Bus sensor object names generated
# by phosphor-hwmon.
CORE_SENSORS="CPU_Core0 CPU_Core1 CPU_Core2 CPU_Core4 CPU_Core5 CPU_Core6 CPU_Core8 CPU_Core9"

# Aggregated sensor name.
SENSOR_NAME="CPU0_TEMP"

# Sensor value range in degrees Celsius.
#
# D-Bus Sensor.Value uses degrees Celsius, NOT milli-degrees.
LABEL_temp10="CPU0_TEMP"
MIN_VALUE=-40
MAX_VALUE=125
WARNLO_temp11=80000
WARNHI_temp11=90000
CRITLO_temp11=-20000
CRITHI_temp11=95000

# Aggregation/update interval in seconds.
UPDATE_INTERVAL=2
